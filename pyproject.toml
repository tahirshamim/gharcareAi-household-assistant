[project]
name = "gharcare"
version = "0.1.0"
description = "GharCare AI: grounded household appliance, warranty and maintenance assistant"
requires-python = ">=3.10"
dependencies = []   # the core is standard-library only; the real RAG stack is optional (see below)

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
rag = ["chromadb>=0.5", "sentence-transformers>=3.0", "pypdf>=4.0"]
llm = ["langgraph>=0.2", "langchain-google-genai>=2.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gharcare.api" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
